<!doctype html>

<title>Question Ball 🎱</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Gowun+Dodum&display=swap');
:root{color-scheme:dark;--bg:#0c172e;--panel:#152746;--panel2:#1c3457;--line:rgba(255,255,255,.13);--muted:#b6c5de;--ink:#f8fbff;--yellow:#ffd479;--mint:#92ebd4;--pink:#ffc2d5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 3%,#263c65 0,transparent 43%),radial-gradient(ellipse at 7% 87%,#163e4d 0,transparent 35%),var(--bg);color:var(--ink);font-family:Nunito,'Gowun Dodum',system-ui,sans-serif;overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.shell{max-width:1220px;min-height:100svh;margin:auto;padding:24px 28px 30px;display:flex;flex-direction:column;gap:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:51px;height:51px;border-radius:18px;background:var(--yellow);color:#1d2941;font-size:28px;box-shadow:0 8px 25px #0003}.brand h1{font-size:21px;letter-spacing:.01em;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.top-actions{display:flex;align-items:center;gap:8px}.ghost{border:1px solid var(--line);background:#ffffff09;color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:800;transition:background .2s}.ghost:hover,.chip:hover{background:#ffffff20}.status{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#ffffff0b;color:#dbe8fa;padding:10px 15px;border-radius:999px;font-weight:800;font-size:13px;transition:.2s}.chip.active{background:var(--yellow);color:#172541;border-color:var(--yellow)}.progress{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:800;color:#cad6ea}.progressbar{height:9px;width:135px;background:#ffffff18;border-radius:99px;overflow:hidden}.progressbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow));transition:width .3s}.stage{flex:1;min-height:490px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;border:1px solid rgba(255,255,255,.15);border-radius:32px;background:linear-gradient(145deg,#1b3458e8,#122340fa);box-shadow:0 25px 70px #0005;overflow:hidden;text-align:center;padding:55px 55px 45px}.stage::before,.stage::after{content:"";position:absolute;border-radius:50%;pointer-events:none}.stage::before{width:320px;height:320px;border:1px solid #ffffff16;top:-210px;left:-100px;box-shadow:0 0 0 54px #ffffff04,0 0 0 112px #ffffff03}.stage::after{width:380px;height:380px;border:1px solid #ffffff13;right:-240px;bottom:-220px;box-shadow:0 0 0 60px #ffffff04}.stage-content{position:relative;z-index:1;max-width:880px;width:100%}.ball{display:grid;place-items:center;margin:0 auto 25px;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff4ce,var(--yellow) 52%,#e6a64d 100%);box-shadow:0 18px 60px #ffc65933,inset -13px -16px 24px #8b591d35;transform:rotate(-10deg);font-size:52px;color:#16233d}.eyebrow{font-weight:900;letter-spacing:.17em;color:var(--mint);font-size:13px}.stage h2{font-size:clamp(30px,4.1vw,60px);line-height:1.4;letter-spacing:-.035em;word-break:keep-all;margin:20px auto 17px;font-weight:900;max-width:900px}.stage .sub{color:#c6d3e7;font-size:16px;line-height:1.7;margin:0}.stage-countdown{font-size:clamp(110px,16vw,210px);font-weight:900;color:var(--yellow);line-height:1;animation:pop .5s ease}.fadein{animation:rise .45s cubic-bezier(.2,.75,.3,1) both}@keyframes pop{from{transform:scale(.65);opacity:.35}to{transform:scale(1);opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}.tag{display:inline-block;background:#ffffff19;border:1px solid #ffffff25;color:#e4edf9;border-radius:99px;padding:8px 14px;margin-top:14px;font-size:13px;font-weight:800}.controls{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}.primary{display:inline-flex;gap:10px;align-items:center;justify-content:center;padding:17px 36px;min-width:235px;border:0;border-radius:16px;background:var(--yellow);color:#182743;font-size:17px;font-weight:900;box-shadow:0 10px 25px #0003;transition:transform .2s,filter .2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.055)}.secondary{border:1px solid var(--line);background:#ffffff13;border-radius:16px;color:var(--ink);padding:16px 22px;font-weight:800}.secondary:hover{background:#ffffff22}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#a6b7d2;font-size:12px}.footer kbd{border:1px solid #ffffff33;border-radius:5px;padding:3px 6px;color:#e2ebfc}.overlay{position:fixed;inset:0;z-index:30;background:#061020b9;backdrop-filter:blur(9px);display:none;justify-content:flex-end}.overlay.open{display:flex}.drawer{width:min(560px,100%);height:100%;background:#142541;box-shadow:-18px 0 55px #0006;display:flex;flex-direction:column}.drawer-head{padding:24px 25px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.drawer h2{font-size:23px;margin:0}.drawer-intro{font-size:13px;color:var(--muted);padding:12px 25px 0;line-height:1.7}.form-add{padding:15px 25px 18px;display:flex;gap:9px;border-bottom:1px solid var(--line)}.form-add textarea,.form-add select,.question-row textarea,.question-row select{border:1px solid #ffffff29;border-radius:11px;padding:10px 12px;background:#0e1d36;color:white;outline:none;min-width:0}.form-add textarea:focus,.question-row textarea:focus{border-color:var(--mint)}.form-add textarea{flex:1;min-height:70px;resize:vertical}.form-add-side{display:flex;flex-direction:column;gap:7px}.form-add select{max-width:132px}.mini-primary{border:0;border-radius:10px;padding:10px;background:var(--mint);color:#0e2831;font-weight:900}.question-list{padding:8px 25px;overflow-y:auto;flex:1}.question-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:start}.question-row>span{font-size:13px;color:#a9bbd4;padding-top:11px;width:23px;flex-shrink:0}.question-row textarea{resize:vertical;flex:1;min-height:62px;font-size:14px;line-height:1.5}.question-row-side{display:flex;flex-direction:column;gap:7px}.question-row select{font-size:12px;max-width:125px;padding:8px 5px}.remove{border:1px solid #ff9aab44;border-radius:9px;padding:7px;background:#ff8a9e16;color:#ffb9c5;font-size:12px}.drawer-foot{border-top:1px solid var(--line);padding:15px 25px 20px;display:flex;gap:8px;justify-content:space-between}.warn{color:#ffc0bd}.toast{position:fixed;z-index:60;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#142541;border-radius:12px;padding:12px 18px;box-shadow:0 10px 35px #0006;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.hidden{display:none!important}body.presentation .shell{max-width:none;padding:24px 3vw}body.presentation .stage h2{font-size:clamp(43px,5.7vw,94px)}body.presentation .stage{min-height:60vh}body.presentation .stage .sub{font-size:clamp(18px,2vw,27px)}@media(max-width:650px){.shell{padding:16px;gap:15px}.brand h1{font-size:18px}.brand p{font-size:10px}.logo{height:43px;width:43px;font-size:22px}.top-actions .ghost{padding:9px 11px;font-size:12px}.status{gap:10px}.chips{gap:6px}.chip{padding:8px 10px;font-size:11px}.progressbar{width:80px}.progress{font-size:11px}.stage{padding:36px 20px;min-height:450px;border-radius:23px}.ball{width:86px;height:86px;font-size:42px}.stage h2{font-size:clamp(26px,7vw,39px)}.stage .sub{font-size:13px}.footer{font-size:10px}.footer .keys{display:none}.primary{min-width:0;width:100%}.controls{flex-wrap:nowrap}.secondary{padding:13px 16px}.form-add{padding-left:14px;padding-right:14px}.question-list{padding:8px 14px}.question-row textarea{font-size:13px}.question-row select{max-width:103px}.drawer-foot{padding:12px 14px}.drawer-foot button{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo">🎱</div><div><h1>Question Ball</h1><p>우리 다락방, 더 가까워지는 시간 ✨</p></div></div><div class="top-actions"><button class="ghost" id="editBtn" aria-label="질문 편집">✏️ <span class="textEdit">질문 편집</span></button><button class="ghost" id="fullscreenBtn" aria-label="전체화면">⛶ <span id="fullscreenLabel">전체화면</span></button></div></header>
<section class="status"><div class="chips" role="group" aria-label="질문 카테고리"><button class="chip active" data-cat="all">🎲 전체 랜덤</button><button class="chip" data-cat="fun">🤣 웃긴 질문</button><button class="chip" data-cat="taste">🍕 취향·일상</button><button class="chip" data-cat="deep">💗 서로 알아가기</button></div><div class="progress"><span id="progressText">0 / 30</span><div class="progressbar"><div id="progressFill"></div></div></div></section>
<main class="stage" id="stage" aria-live="polite"><div class="stage-content" id="stageContent"><div class="ball" aria-hidden="true">?</div><div class="eyebrow">LET'S GET TO KNOW EACH OTHER</div><h2>질문을 뽑고,<br>서로를 알아가요! 🎉</h2><p class="sub">버튼을 눌러 질문을 뽑고 자유롭게 답해보세요.<br>이야기를 나눴다면 다음 질문으로 넘어가요!</p></div></main>
<div class="controls"><button class="primary" id="nextBtn">✨ 첫 질문 뽑기</button><button class="secondary" id="undoBtn" disabled title="이전 질문으로 돌아가기">↶ 이전 질문</button><button class="secondary" id="restartBtn" title="현재 카테고리 진행 기록 초기화">↻ 다시 시작</button></div>
<footer class="footer"><span>💛 정답은 없어요. 편하게 이야기하고, 어려우면 패스해도 괜찮아요!</span><span class="keys"><kbd>Space</kbd> 다음 질문 &nbsp; <kbd>F</kbd> 전체화면 &nbsp; <kbd>E</kbd> 편집</span></footer>
</div>
<div class="overlay" id="overlay"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle">✏️ 질문 편집</h2><button class="ghost" id="closeEdit" aria-label="닫기">✕</button></div><div class="drawer-intro">질문을 수정하거나 추가할 수 있어요. 변경 내용은 이 브라우저에 자동 저장됩니다. 기존에 뽑은 질문의 기록도 유지돼요.</div><div class="form-add"><textarea id="newQuestion" placeholder="새 질문을 입력하세요..." maxlength="300"></textarea><div class="form-add-side"><select id="newCategory" aria-label="새 질문 카테고리"><option value="fun">🤣 웃긴 질문</option><option value="taste">🍕 취향·일상</option><option value="deep">💗 알아가기</option></select><button class="mini-primary" id="addQuestion">+ 질문 추가</button></div></div><div class="question-list" id="questionList"></div><div class="drawer-foot"><button class="ghost warn" id="restoreBtn">기본 30개 복원</button><button class="ghost" id="saveCloseBtn">✓ 편집 완료</button></div></aside></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const BASE=[
['fun','살면서 누군가에게 닮았다는 말을 들어본 가장 의외의 연예인, 캐릭터, 동물은?'],
['fun','내가 생각하는 나의 가장 쓸데없는 재능은?'],
['fun','하루 동안 동물로 살아야 한다면 어떤 동물이 되고 싶어?'],
['fun','지금까지 했던 가장 어이없는 실수는?'],
['fun','내 인생에서 가장 황당했던 별명은?'],
['fun','내 인생이 예능 프로그램이라면 제목은 뭐라고 지을래?'],
['fun','만약 갑자기 100억이 생긴다면 가장 먼저 할 일은?'],
['fun','내가 유독 잘 못하는, 남들은 쉽게 하는 일이 있다면?'],
['fun','내 휴대폰에서 가장 많이 사용하는 이모지는?'],
['fun','아무도 이해 못 하지만 나만의 이상한 습관이 있다면?'],
['taste','평생 딱 한 가지 음식만 먹어야 한다면?'],
['taste','아무런 일정도 없는 완벽한 휴일! 나는 어떻게 보낼까?'],
['taste','요즘 내가 가장 소소하게 행복을 느끼는 순간은?'],
['taste','나만 알고 있기 아까운 맛집이나 장소가 있다면?'],
['taste','사람들이 나를 잘 모르고 있는 의외의 취향은?'],
['taste','지금 당장 비행기 표를 준다면 어디로 떠나고 싶어?'],
['taste','어릴 때 가장 좋아했던 만화나 캐릭터는?'],
['taste','최근에 나를 가장 많이 웃게 만든 것은?'],
['taste','내가 절대 포기할 수 없는 사소한 일상 루틴은?'],
['taste','친구들이 나에게 가장 자주 하는 말은?'],
['deep','처음 만난 사람들이 나를 어떻게 생각하는 것 같아? 실제 모습과 다른 점은?'],
['deep','내가 생각하는 나의 가장 큰 매력 포인트는?'],
['deep','친해지고 싶은 사람에게 나는 어떻게 다가가는 편이야?'],
['deep','나는 어떤 순간에 ‘아, 이 사람이랑 친해졌다!’라고 느껴?'],
['deep','어릴 때 꿈꿨던 직업은? 지금과 얼마나 달라졌어?'],
['deep','타임머신을 타고 내 인생의 어느 한 시점으로 돌아갈 수 있다면?'],
['deep','요즘 새롭게 도전해 보고 싶은 일이 있다면?'],
['deep','누군가 나에게 해줬던 말 중 기억에 남는 칭찬은?'],
['deep','나를 기분 좋게 만드는 아주 사소한 행동은?'],
['deep','올해가 끝나기 전에 꼭 해보고 싶은 한 가지는?']
].map((x,i)=>({id:'base-'+(i+1),category:x[0],text:x[1]}));
const STORAGE='question-ball-v1';const $=id=>document.getElementById(id);const cats={all:'🎲 전체 랜덤',fun:'🤣 웃긴 질문',taste:'🍕 취향·일상',deep:'💗 서로 알아가기'};
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.questions)&&s.questions.length&&Array.isArray(s.history)&&['all','fun','taste','deep'].includes(s.category)){const questions=s.questions.filter(q=>q&&typeof q.id==='string'&&typeof q.text==='string'&&cats[q.category]).map(q=>({...q,text:q.text.slice(0,300)}));if(questions.length)return {questions,history:s.history.filter(h=>h&&typeof h.id==='string'&&cats[h.category]).slice(-200),category:s.category};}}catch(e){}return {questions:BASE.map(q=>({...q})),history:[],category:'all'};}
let state=load(),busy=false,timers=[],countdownId=0,toastTimer;const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){toast('저장 공간을 사용할 수 없어요.');}};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function pool(){return state.questions.filter(q=>state.category==='all'||q.category===state.category)}
function usedIds(){return new Set(state.history.map(h=>h.id))}
function eligible(){const used=usedIds();return pool().filter(q=>!used.has(q.id))}
function currentEntry(){return [...state.history].reverse().find(h=>state.category==='all'||h.category===state.category)}
function renderProgress(){const p=pool(),used=usedIds(),done=p.filter(q=>used.has(q.id)).length;$('progressText').textContent=`${done} / ${p.length}`;$('progressFill').style.width=(p.length?100*done/p.length:0)+'%';document.querySelectorAll('[data-cat]').forEach(b=>{const active=b.dataset.cat===state.category;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});const entry=currentEntry();$('undoBtn').disabled=!entry;$('nextBtn').textContent=p.length===0?'질문을 추가해주세요':eligible().length===0?'🎉 완료 화면 보기':'✨ '+(entry?'다음 질문 뽑기':'첫 질문 뽑기');$('nextBtn').disabled=busy||p.length===0;}
function setStage(html){$('stageContent').innerHTML='<div class="fadein">'+html+'</div>'}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderStage(){const p=pool(),entry=currentEntry(),q=entry&&state.questions.find(x=>x.id===entry.id);if(!p.length){setStage('<div class="ball">?</div><div class="eyebrow">NO QUESTIONS</div><h2>아직 질문이 없어요!</h2><p class="sub">질문 편집에서 새 질문을 추가해주세요.</p>');return;}if(!eligible().length&&!q){setStage('<div class="ball">🎉</div><div class="eyebrow">ALL DONE</div><h2>모든 질문 완료! 🥳</h2><p class="sub">서로에 대해 조금 더 알게 되었나요?<br>다시 시작하면 새로운 순서로 즐길 수 있어요.</p>');return;}if(q){const num=state.questions.findIndex(x=>x.id===q.id)+1;setStage(`<div class="eyebrow">QUESTION ${String(num).padStart(2,'0')}</div><h2>${safe(q.text)}</h2><p class="sub" style="margin-top:24px">이야기를 나눴다면 다음 질문으로 넘어가요! ✨</p>`);}else{setStage('<div class="ball">?</div><div class="eyebrow">LET\'S GET TO KNOW EACH OTHER</div><h2>질문을 뽑고,<br>서로를 알아가요! 🎉</h2><p class="sub">버튼을 눌러 질문을 뽑고 자유롭게 답해보세요.<br>이야기를 나눴다면 다음 질문으로 넘어가요!</p>');}}
function finishBusy(){timers.forEach(clearTimeout);timers=[];busy=false;countdownId++;renderProgress();}
function render(){finishBusy();renderStage();renderProgress()}
function next(){if(busy)return;const available=eligible();if(!available.length){setStage('<div class="ball">🎉</div><div class="eyebrow">ALL DONE</div><h2>모든 질문 완료! 🥳</h2><p class="sub">서로에 대해 조금 더 알게 되었나요?<br>다시 시작하면 새로운 순서로 즐길 수 있어요.</p>');return;}const arr=new Uint32Array(1);let idx;if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(arr);idx=arr[0]%available.length}else idx=Math.floor(Math.random()*available.length);const picked=available[idx];busy=true;renderProgress();let n=3;const token=++countdownId;function step(){if(token!==countdownId)return;if(n>0){$('stageContent').innerHTML=`<div class="eyebrow">READY?</div><div class="stage-countdown" key="${n}">${n}</div><p class="sub">두근두근... 어떤 질문이 나올까?</p>`;n--;timers.push(setTimeout(step,570));}else{state.history.push({id:picked.id,category:picked.category});save();busy=false;renderStage();renderProgress();}}step();}
function undo(){if(busy)return;const ix=state.history.findLastIndex?state.history.findLastIndex(h=>state.category==='all'||h.category===state.category):state.history.map(h=>state.category==='all'||h.category===state.category).lastIndexOf(true);if(ix<0)return;state.history.splice(ix,1);save();render();toast('이전 질문을 뽑기 전으로 돌아갔어요.');}
function restart(){if(busy)return;if(!confirm('현재 '+cats[state.category]+'의 진행 기록을 초기화할까요? 질문 내용은 유지됩니다.'))return;if(state.category==='all')state.history=[];else state.history=state.history.filter(h=>h.category!==state.category);save();render();toast('새 게임이 시작됐어요!');}
function setCategory(cat){if(busy)return;state.category=cat;save();render();}
function editor(){const list=$('questionList');list.replaceChildren();state.questions.forEach((q,i)=>{const row=document.createElement('div');row.className='question-row';const number=document.createElement('span');number.textContent=i+1;const area=document.createElement('textarea');area.value=q.text;area.maxLength=300;area.setAttribute('aria-label',`${i+1}번 질문`);area.addEventListener('input',()=>{q.text=area.value;save();renderProgress()});area.addEventListener('blur',()=>{q.text=q.text.trim()||'새 질문';area.value=q.text;save();renderStage()});const side=document.createElement('div');side.className='question-row-side';const select=document.createElement('select');select.setAttribute('aria-label',`${i+1}번 카테고리`);for(const [key,label] of Object.entries(cats)){if(key==='all')continue;const opt=document.createElement('option');opt.value=key;opt.textContent=label;select.append(opt);}select.value=q.category;select.addEventListener('change',()=>{q.category=select.value;state.history=state.history.map(h=>h.id===q.id?{...h,category:q.category}:h);save();renderProgress();renderStage()});const remove=document.createElement('button');remove.className='remove';remove.textContent='삭제';remove.setAttribute('aria-label',`${i+1}번 질문 삭제`);remove.addEventListener('click',()=>{if(state.questions.length===1){toast('질문은 최소 1개가 필요해요.');return;}state.questions=state.questions.filter(x=>x.id!==q.id);state.history=state.history.filter(h=>h.id!==q.id);save();editor();renderProgress();renderStage()});side.append(select,remove);row.append(number,area,side);list.append(row);});}
function openEditor(){if(busy)return;editor();$('overlay').classList.add('open');document.body.style.overflow='hidden';$('closeEdit').focus();}
function closeEditor(){$('overlay').classList.remove('open');document.body.style.overflow='';render();}
function addQuestion(){const txt=$('newQuestion').value.trim();if(!txt){toast('새 질문을 입력해주세요!');return;}state.questions.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),text:txt.slice(0,300),category:$('newCategory').value});$('newQuestion').value='';save();editor();renderProgress();toast('질문을 추가했어요!');$('newQuestion').focus();}
function restore(){if(!confirm('편집한 질문을 모두 지우고 기본 30개 질문으로 복원할까요? 진행 기록도 초기화됩니다.'))return;state.questions=BASE.map(q=>({...q}));state.history=[];save();editor();renderProgress();toast('기본 질문 30개를 복원했어요.');}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else{document.body.classList.toggle('presentation');toast('브라우저 전체화면이 지원되지 않아 큰 화면 모드로 전환했어요.');}}catch(e){document.body.classList.toggle('presentation');toast('전체화면 대신 큰 화면 모드로 전환했어요.');}syncFullscreen();}
function syncFullscreen(){const on=!!document.fullscreenElement||document.body.classList.contains('presentation');document.body.classList.toggle('presentation',on);$('fullscreenLabel').textContent=on?'전체화면 종료':'전체화면';}
$('nextBtn').addEventListener('click',next);$('undoBtn').addEventListener('click',undo);$('restartBtn').addEventListener('click',restart);document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.cat)));$('editBtn').addEventListener('click',openEditor);$('closeEdit').addEventListener('click',closeEditor);$('saveCloseBtn').addEventListener('click',closeEditor);$('overlay').addEventListener('mousedown',e=>{if(e.target===$('overlay'))closeEditor();});$('addQuestion').addEventListener('click',addQuestion);$('restoreBtn').addEventListener('click',restore);$('fullscreenBtn').addEventListener('click',fullscreen);document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open')){closeEditor();return;}if(e.target.closest('input,textarea,select,button')||e.altKey||e.ctrlKey||e.metaKey||$('overlay').classList.contains('open'))return;if(e.code==='Space'){e.preventDefault();next();}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key.toLowerCase()==='e'){e.preventDefault();openEditor();}});
render();
})();
</script>
</body>
</html>
