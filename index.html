<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101d35">
  <title>Question Ball 🎱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 전체 페이지 -->
  <div class="shell">
    <!-- 상단: 로고, 제목, 편집/전체화면 버튼 -->
    <header class="top">
      <div class="brand">
        <div class="logo">🎱</div>
        <div>
          <h1>Question Ball</h1>
          <p>김가영 다락방, 더 가까워지는 시간 ✨</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="editBtn" aria-label="질문 편집">
          ✏️ <span class="textEdit">질문 편집</span>
        </button>
        <button class="ghost" id="fullscreenBtn" aria-label="전체화면">
          ⛶ <span id="fullscreenLabel">전체화면</span>
        </button>
      </div>
    </header>

    <!-- 질문 카테고리 및 진행률 -->
    <section class="status">
      <div class="chips" role="group" aria-label="질문 카테고리">
        <button class="chip active" data-cat="all">🎲 전체 랜덤</button>
        <button class="chip" data-cat="fun">🤣 웃긴 질문</button>
        <button class="chip" data-cat="taste">🍕 취향·일상</button>
        <button class="chip" data-cat="deep">💗 서로 알아가기</button>
      </div>
      <div class="progress">
        <span id="progressText">0 / 30</span>
        <div class="progressbar">
          <div id="progressFill"></div>
        </div>
      </div>
    </section>

    <!-- 메인 질문 카드: 질문이 나오면 script.js에서 내용을 교체함 -->
    <main class="stage" id="stage" aria-live="polite">
      <div class="stage-content" id="stageContent">
        <div class="ball" aria-hidden="true">?</div>
        <div class="eyebrow">LET'S GET TO KNOW EACH OTHER</div>
        <h2>질문을 뽑고,<br>서로를 알아가요! 🎉</h2>
        <p class="sub">
          버튼을 눌러 질문을 뽑고 자유롭게 답해보세요.<br>
          이야기를 나눴다면 다음 질문으로 넘어가요!
        </p>
      </div>
    </main>

    <!-- 게임 조작 버튼 -->
    <div class="controls">
      <button class="primary" id="nextBtn">✨ 첫 질문 뽑기</button>
      <button class="secondary" id="undoBtn" disabled title="이전 질문으로 돌아가기">
        ↶ 이전 질문
      </button>
      <button class="secondary" id="restartBtn" title="현재 카테고리 진행 기록 초기화">
        ↻ 다시 시작
      </button>
    </div>

    <!-- 하단 안내 문구 / 키보드 단축키 -->
    <footer class="footer">
      <span>💛 편하게 이야기하고 어려우면 패스도 가능~ </span>
      <span class="keys">
        <kbd>Space</kbd> 다음 질문 &nbsp;
        <kbd>F</kbd> 전체화면 &nbsp;
        <kbd>E</kbd> 편집
      </span>
    </footer>
  </div>

  <!-- 질문 편집 패널 -->
  <div class="overlay" id="overlay">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <h2 id="drawerTitle">✏️ 질문 편집</h2>
        <button class="ghost" id="closeEdit" aria-label="닫기">✕</button>
      </div>

      <div class="drawer-intro">
        질문을 수정하거나 추가할 수 있어요. 변경 내용은 이 브라우저에 자동 저장됩니다.
        기존에 뽑은 질문의 기록도 유지돼요.
      </div>

      <div class="form-add">
        <textarea id="newQuestion" placeholder="새 질문을 입력하세요..." maxlength="300"></textarea>
        <div class="form-add-side">
          <select id="newCategory" aria-label="새 질문 카테고리">
            <option value="fun">🤣 웃긴 질문</option>
            <option value="taste">🍕 취향·일상</option>
            <option value="deep">💗 알아가기</option>
          </select>
          <button class="mini-primary" id="addQuestion">+ 질문 추가</button>
        </div>
      </div>

      <div class="question-list" id="questionList"></div>

      <div class="drawer-foot">
        <button class="ghost warn" id="restoreBtn">기본 30개 복원</button>
        <button class="ghost" id="saveCloseBtn">✓ 편집 완료</button>
      </div>
    </aside>
  </div>

  <!-- 알림 메시지 -->
  <div class="toast" id="toast" role="status"></div>

  <!-- 게임 로직 -->
  <script src="script.js"></script>
</body>
</html>
